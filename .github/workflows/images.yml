name: Find deal pictures
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: deal-hunt
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/images.mjs
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      - name: Commit pictures
        run: |
          git config user.name "deal-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Deal pictures $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
