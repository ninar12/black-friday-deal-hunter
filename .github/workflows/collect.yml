name: Daily deal hunt
on:
  schedule:
    - cron: "0 13 * * *"   # 5 AM Pacific
    - cron: "0 1 * * *"    # 5 PM Pacific
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit new deals
        run: |
          git config user.name "deal-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Daily deal hunt $(date -u +%F)" && git push)
