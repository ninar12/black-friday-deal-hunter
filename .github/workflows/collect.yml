name: Daily deal hunt
on:
  schedule:
    - cron: "0 13 * * *"   # once a day, 5 AM Pacific
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: deal-hunt
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Check shop links and brand websites
        run: node scripts/sites.mjs
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit new deals
        run: |
          git config user.name "deal-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Daily deal hunt $(date -u +%F)"
          # Someone may have pushed while the hunt ran: replay on top, the hunt's data wins.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
